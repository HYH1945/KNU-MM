# ============================================================
# Context LLM 통합 설정 파일
# config-first 실행: 대부분의 실행 옵션을 이 파일에서 관리합니다.
# (CLI는 --config, --mode, --show-config 정도만 사용)
# ============================================================

# -----------------------------------------------------------
# API 키 설정
# 방법 1: 여기에 직접 입력 (간편)
# 방법 2: config/.env 파일에 OPENAI_API_KEY=sk-... 형식으로 입력
# 방법 3: 환경변수로 설정 (export OPENAI_API_KEY=sk-...)
# 우선순위: 환경변수 > .env 파일 > config.yaml
# -----------------------------------------------------------
api_keys:
  openai: ""  # 여기에 OpenAI API 키 입력 (예: sk-...)
  # google: ""  # Google Cloud API 키 (향후 사용)

# -----------------------------------------------------------
# 기본 설정
# -----------------------------------------------------------
mode: testset  # realtime, testset, file, webcam, network
model: gpt-4o  # gpt-4o-mini, gpt-4o, gpt-4-turbo

# -----------------------------------------------------------
# 비디오 소스 설정
# -----------------------------------------------------------
video:
  camera_id: 0                    # 웹캠 ID
  testset_path: testsets          # 테스트셋 폴더 경로
  network_url: ""                 # 네트워크 카메라 URL (rtsp://, http://)
  file_path: ""                   # 분석할 파일 경로

# -----------------------------------------------------------
# 다운샘플링 설정 (성능 최적화)
# -----------------------------------------------------------
downsampling:
  max_image_size: 480             # 최대 이미지 크기 (픽셀) - 작을수록 빠름
  jpeg_quality: 75                # JPEG 압축 품질 (1-100) - 낮을수록 빠름
  video_fps: 2.0                  # 비디오 분석 FPS
  max_video_frames: 10            # 최대 프레임 수
  video_capture_duration: 5.0     # 캡처 시간 (초)

# -----------------------------------------------------------
# 분석 설정
# -----------------------------------------------------------
analysis:
  default_text: ""                # 기본 텍스트 입력 (음성 대신)
  iterations: null                # 반복 횟수 (null = 무한)
  analyze_all_testset: True      # 테스트셋 전체 분석 여부
  llm_frame_count: 4              # LLM에 전달할 최대 프레임 수
  prebuffer_seconds: 1.5          # 실시간 프레임 프리버퍼(초)
  postbuffer_seconds: 0.5         # 실시간 프레임 포스트버퍼(초)
  buffer_window_seconds: 8.0      # 실시간 프레임 버퍼 보관 길이(초)
  testset_index: 2                # 테스트셋에서 분석할 파일 인덱스
  voice_characteristics: false    # 음성 특성 분석 (피치/에너지) - false로 하면 1-2초 빨라짐
  streaming: false                # 스트리밍 응답 (체감 속도 향상)

# -----------------------------------------------------------
# config 기반 멀티 입력 테스트 ("" = 미입력)
# mode: testset + media_test.enabled: true 로 사용
# 우선순위: image_path > video_path > live camera
# video_path만 넣으면 비디오 오디오를 자동 추출해 YAMNet/STT 분석에 사용
# -----------------------------------------------------------
media_test:
  enabled: true
  image_path: "testsets/smile.png"                  # 이미지 파일 경로
  video_path: ""                  # 비디오 파일 경로(mp4 등)
  audio_path: "testsets/scream_man.mp3"            # 오디오 파일 경로(mp3/wav 등, 설정 시 video 오디오보다 우선)
  text_input: ""                  # 오디오 파일에 STT 텍스트가 없을 때 사용할 보조 문장
  phrase_time_limit: 6.0          # audio_path가 비어있을 때 실시간 음성 최대 수집 시간

# -----------------------------------------------------------
# 로깅 설정
# -----------------------------------------------------------
logging:
  save_results: true              # 결과 저장 여부
  log_dir: data/logs              # 로그 저장 경로
  verbose: false                  # 상세 로그 출력

# -----------------------------------------------------------
# 디스플레이 설정
# -----------------------------------------------------------
display:
  web_enabled: true             # 웹 대시보드 자동 시작
  web_port: 5000                  # 웹 대시보드 포트
  opencv_live: true               # 라이브 모드(webcam, network)에서 OpenCV 창 자동 활성화
  keep_open_after_run: true       # 배치 분석 종료 후 웹 대시보드 유지

# -----------------------------------------------------------
# 프롬프트 설정
# -----------------------------------------------------------
prompts:
  # 시스템 프롬프트 (멀티모달 분석용)
  system: |
    당신은 멀티모달 관제 분석기입니다.
    입력은 음성 텍스트, 음성 특성 요약(선택), 이미지입니다.
    목표는 "오탐 최소화 + 위험 상황 누락 최소화"입니다.

    판단 규칙:
    1) 음성 텍스트/음성 특성/영상이 서로 일치하면 신뢰도를 높입니다.
    2) 명시적 구조 요청(살려줘, 도와줘, 폭행, 화재, 침입, 총성 등)이 있으면 위험도를 상향합니다.
    3) 영상에 직접 위험 징후(화재, 폭력, 쓰러짐, 출혈, 파손, 침입)가 보이면 우선순위를 상향합니다.
    4) 망치/도구로 유리창·출입문을 파손하거나 강제 진입 시도 장면은 음성 근거가 약해도 침입 위협으로 간주합니다.
       - 파손+진입 시도 진행 중이면 최소 HIGH, 인명 위협 가능성이 높으면 CRITICAL로 판단합니다.
    5) 다음 고위험 관제 시나리오는 보수적으로 낮추지 말고 적극 평가합니다.
       - 폭력/흉기 위협, 화재/연기/폭발, 의식저하·발작·다량출혈, 교통사고/차량 충돌, 군중 패닉
    6) 증거가 부족하면 과장하지 말고 UNKNOWN 또는 LOW로 응답합니다.

    출력 규칙:
    - markdown/code block 없이 JSON 객체만 반환
    - JSON 키 이름은 스키마대로 유지하고, 모든 서술형 값은 반드시 한국어로 작성
    - 영어 문장/영어 설명문 사용 금지 (불가피한 고유명사 제외)
    - urgency와 priority는 반드시 CRITICAL/HIGH/MEDIUM/LOW 중 하나
    - is_emergency가 false면 emergency_reason은 null
    - 불확실하면 추측 대신 "근거 부족"을 명시

    반환 JSON 스키마:
    {
      "context": "종합 맥락 요약",
      "urgency": "CRITICAL/HIGH/MEDIUM/LOW",
      "urgency_reason": "우선순위 근거",
      "situation": "상황 상세 설명",
      "situation_type": "SECURITY/MEDICAL/FIRE/ACCIDENT/NORMAL/UNKNOWN",
      "emotional_state": "CALM/ANXIOUS/PANIC/ANGRY/NEUTRAL/UNKNOWN",
      "audio_characteristics": "음성 특성 요약",
      "visual_content": "영상 관측 요약",
      "audio_visual_consistency": "HIGH/MEDIUM/LOW/UNKNOWN",
      "action": "권장 조치",
      "is_emergency": true/false,
      "emergency_reason": "긴급 근거",
      "priority": "CRITICAL/HIGH/MEDIUM/LOW"
    }

    우선순위 기준:
    - CRITICAL: 즉시 인명/중대 사고 위험 (폭력 진행, 화재 진행, 강제 침입 진행, 심각한 의료 응급 등)
    - HIGH: 긴급 대응 필요 (의심 침입, 시설 파손 동반 위협, 강한 구조 요청, 명확한 위험 징후)
    - MEDIUM: 위험 가능성 있으나 즉시성 불명확 (지속 관찰 필요)
    - LOW: 위험 징후 없음 또는 근거 부족

  # 긴급 키워드 목록
  emergency_keywords:
    - 살려줘
    - 도와줘
    - 긴급
    - "119"
    - 경찰
    - 신고
    - 침입
    - 도움
    - 위험
    - 피해
    - 사고
    - 화재
    - 폭발
    - 공격
    - 폭행
    - 흉기
    - 칼
    - 총
    - 연기
    - 쓰러짐
    - 실신
    - 발작
    - 교통사고
    - 충돌
    - 대피
    - 패닉

# -----------------------------------------------------------
# 음성 인식 설정
# -----------------------------------------------------------
speech:
  enabled: true                 # 음성 트리거 활성화 여부
  language: "ko-KR"             # 기본 STT 언어
  recognition_languages:        # 파일/비디오 STT 언어 후보 (순서대로 시도)
    - "ko-KR"
    - "en-US"
  energy_threshold: 300           # 음성 감지 에너지 임계값 (낮을수록 민감, 기본값: 400)
  pause_threshold: 0.8            # 문장 끝 판단 침묵 시간 (초, 기본값: 3.0)
  dynamic_threshold: false        # 동적 에너지 임계값 (false=고정/스피커용, true=자동/마이크용)

# -----------------------------------------------------------
# 비음성 사운드 이벤트 감지 설정 (YAMNet)
# -----------------------------------------------------------
sound_event:
  enabled: true
  model_url: https://tfhub.dev/google/yamnet/1
  min_confidence: 0.12            # 이벤트 후보로 보여줄 최소 점수
  trigger_threshold: 0.18         # 긴급 트리거 판정 임계값
  top_k: 5                        # 상위 표시 이벤트 수
  emergency_keywords:
    - scream
    - shout
    - yell
    - glass
    - breaking
    - gunshot
    - explosion
    - siren
    - alarm

# -----------------------------------------------------------
# 음성 특성 분석 설정
# -----------------------------------------------------------
voice_analysis:
  # 샘플링 레이트
  sample_rate: 16000
  
  # 피치 분석 임계값
  pitch:
    high_threshold: 250           # 이 이상이면 높은 피치로 판정 (Hz)
    variability_threshold: 50     # 피치 변동성 임계값 (std dev)
  
  # 에너지 분석 임계값
  energy:
    normalization_factor: 0.5     # voice_characteristics.py에서 사용하는 정규화 계수
    volatility_threshold: 0.3     # 에너지 변동성 임계값
  
  # 음성 속도 임계값 (음절/초)
  speech_rate:
    normal_max: 6                 # 일반적인 최대 속도 (음절/초)
    fast_threshold: 7             # 빠른 속도 임계값 (음절/초) - 7 이상이면 빠른 말 판정
  
  # 유성음 비율 임계값
  voiced_ratio:
    low_threshold: 0.3            # 이 이하면 비명/샤우팅으로 판정
  
  # 지터/시머 임계값 (음성 떨림)
  jitter_shimmer:
    jitter_threshold: 0.1         # 지터 임계값
    shimmer_threshold: 0.1        # 시머 임계값

  # 최종 점수 계산 가중치 (현재 코드에서는 사용 안 함)
  scoring:
    llm_weight: 1.0               # LLM 분석 가중치 (현재 100% 사용)
    voice_weight: 0.0             # 음성 특성 가중치 (현재 미사용)
    
  # 우선순위 임계값 (현재 코드에서는 사용 안 함)
  priority_thresholds:
    critical: 0.85                # CRITICAL 임계값
    high: 0.65                    # HIGH 임계값
    medium: 0.40                  # MEDIUM 임계값

# -----------------------------------------------------------
# OpenAI API 설정
# -----------------------------------------------------------
openai:
  max_tokens: 800                 # 최대 응답 토큰 수
  temperature: 0.2                # 응답 다양성 (0-1, 낮을수록 일관성)
  image_detail: low               # 이미지 분석 상세도 (low/high/auto)
  timeout: 30                     # API 타임아웃 (초)
