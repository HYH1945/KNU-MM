# Mic Array + ContextLLM fusion config

camera:
  # 0: default webcam, RTSP URL, or video file path
  source: 0

ptz:
  control_mode: "onvif"      # onvif | hikvision_http | both
  ip: ""
  port: 80
  user: ""
  password: ""
  tilt_on_doa: -15
  settle_seconds: 0.6
  max_doa_age_seconds: 5.0

mic_array:
  agc_max_gain: 15.0
  vad_threshold: 10.0
  confidence_threshold: 0.6
  zenith_confidence: 0.4
  zenith_gain: 10.0
  history_size: 10

stt:
  language: "ko-KR"
  energy_threshold: 400
  pause_threshold: 0.8
  phrase_time_limit: 6.0
  dynamic_threshold: true

non_speech:
  # STT가 텍스트로 인식하지 못한 오디오를 즉시 분류(YAMNet)하여 멀티모달로 전달
  enabled: true
  min_audio_duration: 0.2
  cooldown_seconds: 1.5
  trigger_threshold: 0.18
  # false: emergency 키워드 트리거 시에만 분석
  # true : 감지된 비음성 이벤트 전부 분석(부하 증가 가능)
  analyze_on_detected: false
  # Optional overrides. 비워두면 contextllm/config/config.yaml 의 sound_event 설정 사용
  # model_url: "https://tfhub.dev/google/yamnet/1"
  # min_confidence: 0.12
  # trigger_threshold: 0.25
  # top_k: 5
  # emergency_keywords: ["scream", "glass", "gunshot", "explosion", "siren"]

context_llm:
  # Optional model override for ContextLLMService
  model: "gpt-4o-mini"
  # Leave empty to auto-use contextllm/config/config.yaml
  config_path: ""

server:
  enabled: true
  url: "http://localhost:8100/event"
  timeout: 2.0
  event_dashboard_port: 8100
  contextllm_dashboard_port: 5100
  auto_start_dashboard: false            # 이벤트 모니터링형 대시보드 자동 시작(기존 키)
  auto_start_event_dashboard: false      # 이벤트 모니터링형 대시보드 자동 시작(신규 별칭)
  dashboard_script: "integrated_system/modules/dashboard_server.py"
  auto_start_contextllm_dashboard: true # contextllm 웹 대시보드 자동 시작
  contextllm_dashboard_script: "contextllm/src/web/app.py"

openai:
  # Optional: API key can be set here for this fusion runner.
  # Recommended for teams: leave empty and use .env or --openai-api-key.
  api_key: ""

runtime:
  log_level: "INFO"
